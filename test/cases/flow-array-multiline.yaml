jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-14,
            windows-2025,
            windows-11-arm,
          ]
        include:
          # Keep the existing required-check name
          - os: macos-14
            runner: macos-15
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 90
